[project]
name = "ga-triangles"
version = "0.1.0"
description = "TP2 SIA - Image approximation with triangles via Genetic Algorithms"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ga-triangles = "ga_triangles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga_triangles"]
